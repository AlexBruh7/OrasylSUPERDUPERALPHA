## Nombres visibles del contenido de Orasyl.
## Formato exacto que exige Mindustry: <contentType>.<id-interno-real>.name
##   - floors/blocks (incluye rudimentary-quarry) -> "block"
##   - status effects                             -> "status"
##   - items (stone)                               -> "item"
##   - liquids (salty-water)                        -> "liquid"
## (ver mindustry.ctype.ContentType para la lista completa de prefijos)
##
## OJO: el id interno real lleva el prefijo del mod ("orasyl-") antepuesto
## automáticamente por el motor (ver ContentLoader.transformName). El id que
## le pasas al constructor en Java es el corto ("dry-grass"), pero aquí en
## el bundle hay que escribir el id YA transformado.

block.orasyl-dry-grass.name = Dry Grass
block.orasyl-volcanic-stone.name = Volcanic Stone
block.orasyl-sandstone-floor.name = Sandstone Floor
block.orasyl-deep-salty-water.name = Deep Salty Water
block.orasyl-salty-water.name = Salty Water
block.orasyl-sand-salty-water.name = Sand Salty Water
block.orasyl-deeper-water.name = Deeper Water
block.orasyl-abyss-water.name = Abyss Water
block.orasyl-dry-shrubs.name = Dry Shrubs
block.orasyl-sandstone-wall.name = Sandstone Wall
block.orasyl-rudimentary-quarry.name = Rudimentary Quarry

status.orasyl-salty-rusting.name = Salty Rusting

item.orasyl-stone.name = Stone

liquid.orasyl-salty-water.name = Salty Water
